 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🚀 Space Shooter - Utkarsh</title>

<!-- GOOGLE SEO META TAGS -->
<meta name="description" content="Play Space Shooter online game created by Utkarsh. Enjoy shooting enemies, laser guns, and defeating bosses!">
<meta name="keywords" content="space shooter game, Utkarsh game, html5 space game, play online space shooter">
<meta name="author" content="Utkarsh">

<style>
* {
    box-sizing: border-box;
    touch-action: manipulation;
    margin: 0;
    padding: 0;
}

body, html {
    width: 100%;
    height: 100%;
    background: #03030d;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    overflow: hidden;
}

#game-container {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    width: 100vw;
    height: 100vh;
    padding: 5px;
}

h1 {
    color: #00eaff;
    text-shadow: 0 0 15px #00eaff;
    font-size: 18px;
    margin: 2px 0;
}

#info {
    font-size: 13px;
    margin-bottom: 2px;
}

canvas {
    background: #050520;
    border: 2px solid #00eaff;
    box-shadow: 0 0 25px #00eaff;
    width: 100%;
    flex-grow: 1;
    max-height: 72vh;
    display: block;
}

.screen {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.92);
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    z-index: 10;
}

.screen h2 {
    font-size: 34px;
    color: #00eaff;
    text-shadow: 0 0 20px #00eaff;
    margin: 10px;
}

.screen p {
    margin: 5px 0;
    font-size: 14px;
}

button {
    padding: 12px 30px;
    font-size: 18px;
    font-weight: bold;
    border: 0;
    border-radius: 10px;
    cursor: pointer;
    background: #00eaff;
    color: #001018;
    box-shadow: 0 0 20px #00eaff;
    margin-top: 10px;
}

button:hover {
    transform: scale(1.08);
}

.hidden {
    display: none !important;
}

#gameOver h2 {
    color: #ff3158;
    text-shadow: 0 0 20px red;
}

#message {
    position: fixed;
    top: 50px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 20px;
    font-weight: bold;
    color: yellow;
    text-shadow: 0 0 15px yellow;
    pointer-events: none;
    z-index: 5;
}

/* MOBILE TOUCH CONTROLS */
#controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    max-width: 800px;
    padding: 5px 10px;
}

.dpad {
    display: grid;
    grid-template-columns: 50px 50px 50px;
    grid-template-rows: 40px 40px;
    gap: 3px;
    justify-content: center;
}

.mob-btn {
    font-size: 16px;
    background: rgba(0, 234, 255, 0.2);
    border: 2px solid #00eaff;
    color: #00eaff;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
    -webkit-user-select: none;
}

.mob-btn:active {
    background: rgba(0, 234, 255, 0.6);
}

#upBtn { grid-column: 2; grid-row: 1; }
#leftBtn { grid-column: 1; grid-row: 2; }
#downBtn { grid-column: 2; grid-row: 2; }
#rightBtn { grid-column: 3; grid-row: 2; }

#shootBtn {
    background: rgba(255, 49, 88, 0.3);
    border: 2px solid #ff3158;
    color: #ff3158;
    width: 90px;
    height: 60px;
    font-size: 16px;
    font-weight: bold;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
    -webkit-user-select: none;
}

#shootBtn:active {
    background: rgba(255, 49, 88, 0.7);
}
</style>
</head>

<body>

<div id="game-container">
    <div>
        <h1>🚀 SPACE SHOOTER - UTKARSH</h1>
        <div id="info">
            Score: <span id="score">0</span>
            &nbsp; | &nbsp;
            ❤️ Lives: <span id="lives">3</span>
            &nbsp; | &nbsp;
            ⭐ Level: <span id="level">1</span>
        </div>
    </div>

    <canvas id="game"></canvas>

    <!-- MOBILE CONTROLS -->
    <div id="controls">
        <div class="dpad">
            <div class="mob-btn" id="upBtn">⬆️</div>
            <div class="mob-btn" id="leftBtn">⬅️</div>
            <div class="mob-btn" id="downBtn">⬇️</div>
            <div class="mob-btn" id="rightBtn">➡️</div>
        </div>
        <div id="shootBtn">🔥 FIRE</div>
    </div>
</div>

<div id="message"></div>

<!-- START SCREEN -->
<div id="startScreen" class="screen">
    <h2>🚀 SPACE SHOOTER</h2>
    <p><b>Created by Utkarsh</b></p>
    <p>⬆️ ⬇️ ⬅️ ➡️ / W A S D = Move Anywhere</p>
    <p>SPACE / FIRE = Khatarnak Laser Gun</p>
    <button onclick="startGame()">START GAME</button>
</div>

<!-- GAME OVER -->
<div id="gameOver" class="screen hidden">
    <h2>💥 GAME OVER</h2>
    <p>Your Score: <strong id="finalScore">0</strong></p>
    <button onclick="restartGame()">PLAY AGAIN</button>
</div>

<script>

// ======================================
// CANVAS & FULLSCREEN SIZING
// ======================================

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resizeCanvas() {
    canvas.width = window.innerWidth > 800 ? 800 : window.innerWidth - 10;
    canvas.height = window.innerHeight * 0.65;
}
window.addEventListener("resize", resizeCanvas);
resizeCanvas();


// ======================================
// REAL AUDIO SYSTEM (HEAVY LASER)
// ======================================

const AudioContext =
    window.AudioContext || window.webkitAudioContext;

const audioCtx = new AudioContext();

function sound(type) {

    if (audioCtx.state === "suspended") {
        audioCtx.resume();
    }

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    const now = audioCtx.currentTime;

    if (type === "shoot") {
        // Real heavy laser sound
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(1400, now);
        osc.frequency.exponentialRampToValueAtTime(
            150,
            now + .18
        );

        gain.gain.setValueAtTime(.2, now);
        gain.gain.exponentialRampToValueAtTime(
            .01,
            now + .18
        );

        osc.start();
        osc.stop(now + .18);
    }

    if (type === "explosion") {
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.exponentialRampToValueAtTime(
            35,
            now + .35
        );

        gain.gain.setValueAtTime(.25, now);
        gain.gain.exponentialRampToValueAtTime(
            .01,
            now + .35
        );

        osc.start();
        osc.stop(now + .35);
    }

    if (type === "hit") {
        osc.type = "triangle";
        osc.frequency.setValueAtTime(350, now);
        osc.frequency.exponentialRampToValueAtTime(
            70,
            now + .3
        );

        gain.gain.setValueAtTime(.2, now);
        gain.gain.exponentialRampToValueAtTime(
            .01,
            now + .3
        );

        osc.start();
        osc.stop(now + .3);
    }

    if (type === "coin") {
        osc.type = "sine";
        osc.frequency.setValueAtTime(700, now);
        osc.frequency.setValueAtTime(1100, now + .08);

        gain.gain.setValueAtTime(.2, now);
        gain.gain.exponentialRampToValueAtTime(.01, now + .2);

        osc.start();
        osc.stop(now + .2);
    }

    if (type === "boss") {
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(100, now);
        osc.frequency.exponentialRampToValueAtTime(40, now + .8);

        gain.gain.setValueAtTime(.3, now);
        gain.gain.exponentialRampToValueAtTime(.01, now + .8);

        osc.start();
        osc.stop(now + .8);
    }

    if (type === "gameover") {
        osc.type = "sine";
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.exponentialRampToValueAtTime(50, now + 1);

        gain.gain.setValueAtTime(.3, now);
        gain.gain.exponentialRampToValueAtTime(.01, now + 1);

        osc.start();
        osc.stop(now + 1);
    }
}


// ======================================
// GAME VARIABLES
// ======================================

let score = 0;
let lives = 3;
let level = 1;

let running = false;

let bullets = [];
let enemies = [];
let powerUps = [];

let keys = {};

let lastShot = 0;
let enemyTimer = 0;

let boss = null;


// ======================================
// PLAYER
// ======================================

const player = {
    x: 370,
    y: 370,
    width: 60,
    height: 45,
    speed: 7
};


// ======================================
// CONTROLS
// ======================================

document.addEventListener("keydown", e => {
    keys[e.key.toLowerCase()] = true;
    if (e.code === "Space" || e.key === " ") {
        e.preventDefault();
    }
});

document.addEventListener("keyup", e => {
    keys[e.key.toLowerCase()] = false;
});

const upBtn = document.getElementById("upBtn");
const downBtn = document.getElementById("downBtn");
const leftBtn = document.getElementById("leftBtn");
const rightBtn = document.getElementById("rightBtn");
const shootBtn = document.getElementById("shootBtn");

upBtn.addEventListener("touchstart", (e) => { e.preventDefault(); keys["arrowup"] = true; });
upBtn.addEventListener("touchend", () => { keys["arrowup"] = false; });
upBtn.addEventListener("mousedown", () => { keys["arrowup"] = true; });
upBtn.addEventListener("mouseup", () => { keys["arrowup"] = false; });

downBtn.addEventListener("touchstart", (e) => { e.preventDefault(); keys["arrowdown"] = true; });
downBtn.addEventListener("touchend", () => { keys["arrowdown"] = false; });
downBtn.addEventListener("mousedown", () => { keys["arrowdown"] = true; });
downBtn.addEventListener("mouseup", () => { keys["arrowdown"] = false; });

leftBtn.addEventListener("touchstart", (e) => { e.preventDefault(); keys["arrowleft"] = true; });
leftBtn.addEventListener("touchend", () => { keys["arrowleft"] = false; });
leftBtn.addEventListener("mousedown", () => { keys["arrowleft"] = true; });
leftBtn.addEventListener("mouseup", () => { keys["arrowleft"] = false; });

rightBtn.addEventListener("touchstart", (e) => { e.preventDefault(); keys["arrowright"] = true; });
rightBtn.addEventListener("touchend", () => { keys["arrowright"] = false; });
rightBtn.addEventListener("mousedown", () => { keys["arrowright"] = true; });
rightBtn.addEventListener("mouseup", () => { keys["arrowright"] = false; });

shootBtn.addEventListener("touchstart", (e) => { e.preventDefault(); keys[" "] = true; });
shootBtn.addEventListener("touchend", () => { keys[" "] = false; });
shootBtn.addEventListener("mousedown", () => { keys[" "] = true; });
shootBtn.addEventListener("mouseup", () => { keys[" "] = false; });


// ======================================
// STARS
// ======================================

let stars = [];

for (let i = 0; i < 150; i++) {
    stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 3,
        speed: Math.random() * 2 + .5
    });
}


// ======================================
// START GAME
// ======================================

function startGame() {
    if (audioCtx.state === "suspended") {
        audioCtx.resume();
    }

    document.getElementById("startScreen").classList.add("hidden");

    score = 0;
    lives = 3;
    level = 1;

    bullets = [];
    enemies = [];
    powerUps = [];
    boss = null;

    player.x = canvas.width / 2 - 30;
    player.y = canvas.height - 80;

    running = true;
    updateUI();
    gameLoop();
}


// ======================================
// RESTART
// ======================================

function restartGame() {
    document.getElementById("gameOver").classList.add("hidden");
    startGame();
}


// ======================================
// UI & MESSAGES
// ======================================

function updateUI() {
    document.getElementById("score").textContent = score;
    document.getElementById("lives").textContent = lives;
    document.getElementById("level").textContent = level;
}

function showMessage(text) {
    const msg = document.getElementById("message");
    msg.textContent = text;
    setTimeout(() => {
        msg.textContent = "";
    }, 1500);
}


// ======================================
// DRAW PLAYER
// ======================================

function drawPlayer() {
    ctx.save();
    ctx.shadowBlur = 25;
    ctx.shadowColor = "#00eaff";
    ctx.fillStyle = "#00eaff";

    ctx.beginPath();
    ctx.moveTo(player.x + player.width / 2, player.y);
    ctx.lineTo(player.x, player.y + player.height);
    ctx.lineTo(player.x + player.width / 2, player.y + player.height - 12);
    ctx.lineTo(player.x + player.width, player.y + player.height);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
}


// ======================================
// KHATARNAK LASER BULLET
// ======================================

function shoot() {
    bullets.push({
        x: player.x + player.width / 2 - 5,
        y: player.y,
        width: 10,
        height: 28,
        speed: 16
    });

    sound("shoot");
}

function drawBullet(bullet) {
    ctx.save();
    ctx.fillStyle = "#00ffff";
    ctx.shadowBlur = 25;
    ctx.shadowColor = "#ff00ff";
    ctx.fillRect(bullet.x, bullet.y, bullet.width, bullet.height);
    ctx.restore();
}


// ======================================
// ENEMY
// ======================================

function createEnemy() {
    enemies.push({
        x: Math.random() * (canvas.width - 45),
        y: -50,
        width: 45,
        height: 40,
        speed: 2 + Math.random() * 2 + level * .2
    });
}

function drawEnemy(enemy) {
    ctx.save();
    ctx.fillStyle = "#ff3158";
    ctx.shadowBlur = 18;
    ctx.shadowColor = "#ff3158";

    ctx.beginPath();
    ctx.moveTo(enemy.x + enemy.width / 2, enemy.y);
    ctx.lineTo(enemy.x + enemy.width, enemy.y + enemy.height);
    ctx.lineTo(enemy.x + enemy.width / 2, enemy.y + enemy.height - 10);
    ctx.lineTo(enemy.x, enemy.y + enemy.height);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
}


// ======================================
// POWER-UP
// ======================================

function createPowerUp(x, y) {
    powerUps.push({
        x: x,
        y: y,
        width: 25,
        height: 25,
        speed: 3
    });
}

function drawPowerUp(p) {
    ctx.save();
    ctx.fillStyle = "#00ff66";
    ctx.shadowBlur = 20;
    ctx.shadowColor = "#00ff66";
    ctx.beginPath();
    ctx.arc(p.x + 12, p.y + 12, 12, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
}


// ======================================
// BOSS
// ======================================

function createBoss() {
    boss = {
        x: canvas.width / 2 - 100,
        y: 40,
        width: 200,
        height: 80,
        health: 50,
        maxHealth: 50,
        direction: 1
    };
    sound("boss");
    showMessage("👹 BOSS INCOMING!");
}

function drawBoss() {
    if (!boss) return;
    ctx.save();
    ctx.fillStyle = "#a000ff";
    ctx.shadowBlur = 25;
    ctx.shadowColor = "#a000ff";
    ctx.fillRect(boss.x, boss.y, boss.width, boss.height);

    ctx.fillStyle = "red";
    ctx.fillRect(boss.x + 25, boss.y + 25, 30, 20);
    ctx.fillRect(boss.x + boss.width - 55, boss.y + 25, 30, 20);
    ctx.restore();

    // Health bar
    ctx.fillStyle = "red";
    ctx.fillRect(canvas.width / 2 - 150, 10, 300, 15);
    ctx.fillStyle = "lime";
    ctx.fillRect(canvas.width / 2 - 150, 10, 300 * (boss.health / boss.maxHealth), 15);
}


// ======================================
// STARS
// ======================================

function drawStars() {
    ctx.fillStyle = "white";
    stars.forEach(star => {
        ctx.fillRect(star.x, star.y, star.size, star.size);
        star.y += star.speed;
        if (star.y > canvas.height) {
            star.y = 0;
            star.x = Math.random() * canvas.width;
        }
    });
}


// ======================================
// COLLISION
// ======================================

function collision(a, b) {
    return (
        a.x < b.x + b.width &&
        a.x + a.width > b.x &&
        a.y < b.y + b.height &&
        a.y + a.height > b.y
    );
}


// ======================================
// GAME LOOP
// ======================================

function gameLoop() {
    if (!running) return;

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawStars();

    // Player Movement (All 4 directions)
    if (keys["arrowleft"] || keys["a"]) player.x -= player.speed;
    if (keys["arrowright"] || keys["d"]) player.x += player.speed;
    if (keys["arrowup"] || keys["w"]) player.y -= player.speed;
    if (keys["arrowdown"] || keys["s"]) player.y += player.speed;

    // Boundaries
    if (player.x < 0) player.x = 0;
    if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;
    if (player.y < 0) player.y = 0;
    if (player.y + player.height > canvas.height) player.y = canvas.height - player.height;

    // Shoot
    if (keys[" "] || keys["space"]) {
        const now = Date.now();
        if (now - lastShot > 160) {
            shoot();
            lastShot = now;
        }
    }

    drawPlayer();

    // Bullets
    bullets.forEach((bullet, index) => {
        bullet.y -= bullet.speed;
        drawBullet(bullet);
        if (bullet.y < -20) bullets.splice(index, 1);
    });

    // Enemy Spawn
    enemyTimer++;
    if (enemyTimer > Math.max(20, 55 - level * 3)) {
        createEnemy();
        enemyTimer = 0;
    }

    // Enemies
    enemies.forEach((enemy, ei) => {
        enemy.y += enemy.speed;
        drawEnemy(enemy);

        if (collision(player, enemy)) {
            enemies.splice(ei, 1);
            lives--;
            sound("hit");
            updateUI();
        } else if (enemy.y > canvas.height) {
            enemies.splice(ei, 1);
        }

        bullets.forEach((bullet, bi) => {
            if (collision(bullet, enemy)) {
                enemies.splice(ei, 1);
                bullets.splice(bi, 1);
                score += 10;
                sound("explosion");
                updateUI();

                if (Math.random() < .12) {
                    createPowerUp(enemy.x, enemy.y);
                }
            }
        });
    });

    // Power-ups
    powerUps.forEach((p, pi) => {
        p.y += p.speed;
        drawPowerUp(p);
        if (collision(player, p)) {
            powerUps.splice(pi, 1);
            lives++;
            score += 25;
            sound("coin");
            showMessage("🟢 POWER-UP! +1 LIFE");
            updateUI();
        }
    });

    // Levels
    const newLevel = Math.floor(score / 100) + 1;
    if (newLevel > level) {
        level = newLevel;
        showMessage("⭐ LEVEL " + level);
        updateUI();
        if (level % 5 === 0 && !boss) {
            createBoss();
        }
    }

    // Boss
    if (boss) {
        boss.x += boss.direction * 3;
        if (boss.x < 0 || boss.x + boss.width > canvas.width) {
            boss.direction *= -1;
        }
        drawBoss();

        bullets.forEach((bullet, bi) => {
            if (collision(bullet, boss)) {
                bullets.splice(bi, 1);
                boss.health--;
                sound("hit");

                if (boss.health <= 0) {
                    score += 500;
                    sound("explosion");
                    showMessage("👑 BOSS DEFEATED! +500");
                    boss = null;
                    updateUI();
                }
            }
        });
    }

    if (lives <= 0) {
        endGame();
        return;
    }

    requestAnimationFrame(gameLoop);
}


// ======================================
// END GAME
// ======================================

function endGame() {
    running = false;
    sound("gameover");
    document.getElementById("finalScore").textContent = score;
    document.getElementById("gameOver").classList.remove("hidden");
}

</script>

</body>
</html>
